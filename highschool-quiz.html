
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語クイズ | Eigo Quest</title>
<style>
:root {
  --bg:#f5f7ff; --card:#fff; --ink:#202642;
  --muted:#6e7591; --primary:#5b67e8;
  --good:#16845b; --bad:#c84252; --line:#e5e8f5;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
header {
  background:#fff; border-bottom:1px solid var(--line);
  padding:14px 18px; position:sticky; top:0; z-index:5;
}
.nav {
  max-width:900px; margin:auto; display:flex;
  align-items:center; justify-content:space-between; gap:12px;
}
.brand { font-weight:850; font-size:1.1rem; color:var(--primary); text-decoration:none; }
.nav a:last-child { color:var(--muted); text-decoration:none; }
main { max-width:760px; margin:28px auto; padding:0 16px 48px; }
.panel {
  background:var(--card); border:1px solid var(--line);
  border-radius:22px; padding:clamp(18px,4vw,30px);
  box-shadow:0 10px 35px #28356b0c;
}
h1 { font-size:clamp(1.55rem,4vw,2.1rem); margin:0 0 8px; }
.sub { color:var(--muted); margin:0 0 24px; line-height:1.7; }
label { display:block; font-weight:750; margin:16px 0 8px; }
select,button { font:inherit; }
select {
  width:100%; padding:13px 14px; border:1px solid #d8dcef;
  border-radius:12px; background:#fff; color:var(--ink);
}
button { cursor:pointer; border:0; border-radius:12px; padding:13px 16px; font-weight:800; }
button:disabled { cursor:not-allowed; opacity:.55; }
.primary { background:var(--primary); color:#fff; width:100%; margin-top:18px; }
.secondary { background:#eef0ff; color:var(--primary); }
.stats { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 20px; }
.stat { background:#f0f2ff; border-radius:12px; padding:10px 13px; font-size:.9rem; }
.stat strong { display:block; font-size:1.12rem; }
.progress { height:9px; background:#e9ebf7; border-radius:99px; overflow:hidden; margin:15px 0 22px; }
.progress span { height:100%; display:block; width:0; background:linear-gradient(90deg,#6674f0,#8d69ed); transition:width .2s; }
.question { font-size:clamp(1.8rem,6vw,2.6rem); font-weight:850; text-align:center; margin:22px 0 8px; overflow-wrap:anywhere; }
.question-meta { text-align:center; color:var(--muted); font-size:.9rem; }
.answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:24px; }
.answer {
  background:#fff; border:1px solid var(--line); text-align:left;
  min-height:68px; display:flex; align-items:center; gap:10px;
}
.answer:hover:not(:disabled) { border-color:var(--primary); background:#f8f8ff; }
.answer .letter { background:#eef0ff; color:var(--primary); border-radius:8px; padding:5px 9px; flex:none; }
.answer.correct { border-color:#6fc7a3; background:#effbf5; color:#116a49; }
.answer.wrong { border-color:#e9a0a8; background:#fff2f3; color:#9f2737; }
.feedback { margin-top:16px; border-radius:12px; padding:13px 15px; background:#f3f4fb; line-height:1.6; }
.hidden { display:none !important; }
.result-score { font-size:2.5rem; font-weight:900; color:var(--primary); margin:10px 0; }
.result-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
.small { font-size:.9rem; color:var(--muted); line-height:1.6; }
@media(max-width:520px) {
  .answers,.result-actions { grid-template-columns:1fr; }
  .stat { flex:1; min-width:90px; }
  .panel { border-radius:17px; }
  main { margin-top:18px; }
}
</style>
</head>
<body>
<header>
  <nav class="nav">
    <a class="brand" href="index.html">⚡ Eigo Quest</a>
    <a href="highschool-vocab.html">単語一覧へ →</a>
  </nav>
</header>

<main>
  <section id="setup" class="panel">
    <h1>英単語クイズ 🎯</h1>
    <p class="sub">出題範囲を選んで、英単語をマスターしよう！<br>正解すると経験値（XP）がたまります。</p>

    <div class="stats">
      <div class="stat">累計XP<strong id="totalXp">0 XP</strong></div>
      <div class="stat">レベル<strong id="level">Lv.1</strong></div>
      <div class="stat">復習リスト<strong id="mistakeCount">0語</strong></div>
    </div>

    
<label for="startNumber">開始番号</label>
<input id="startNumber" type="number" min="1" value="1"
  style="width:100%;padding:13px;border:1px solid #d8dcef;border-radius:12px;">

<label for="endNumber">終了番号</label>
<input id="endNumber" type="number" min="1" value="1200"
  style="width:100%;padding:13px;border:1px solid #d8dcef;border-radius:12px;">

<label for="questionLimit">出題数</label>
<input id="questionLimit" type="number" min="1" value="10"
  style="width:100%;padding:13px;border:1px solid #d8dcef;border-radius:12px;">

<p class="small" id="loadStatus">単語データを読み込み中…</p>
<p class="small">指定した範囲から、入力した問題数をランダムに出題します。</p>
<button class="primary" id="startBtn" disabled>クイズを始める</button>

  </section>

  <section id="quiz" class="panel hidden">
    <div class="stats">
      <div class="stat">問題<strong id="questionCount">1 / 10</strong></div>
      <div class="stat">正解<strong id="correctCount">0</strong></div>
      <div class="stat">獲得XP<strong id="sessionXp">0 XP</strong></div>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="question-meta" id="wordNumber"></div>
    <div class="question" id="questionWord">word</div>
    <div class="question-meta">正しい日本語の意味を選んでください</div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback hidden" aria-live="polite"></div>
    <button id="nextBtn" class="primary hidden">次の問題へ →</button>
  </section>

  <section id="result" class="panel hidden">
    <h1>クイズ結果 🎉</h1>
    <div class="result-score" id="resultScore">0 / 10</div>
    <p id="resultMessage"></p>
    <div class="stats">
      <div class="stat">今回のXP<strong id="resultXp">0 XP</strong></div>
      <div class="stat">累計XP<strong id="resultTotalXp">0 XP</strong></div>
      <div class="stat">レベル<strong id="resultLevel">Lv.1</strong></div>
    </div>
    <div id="resultMistakes"></div>
    <div class="result-actions">
      <button class="primary" id="retryBtn">同じ範囲でもう一度</button>
      <button class="secondary" id="homeBtn">範囲選択に戻る</button>
    </div>
  </section>
</main>

<script>
"use strict";

const CSV_FILES = [
  "words-highschool.csv",
  "words-highschool-601-1200.csv"
];

const XP_KEY = "eigoQuestSave";
const MISTAKES_KEY = "eigoQuestMistakes";

let WORDS = [];
let questions = [];
let currentIndex = 0;
let correct = 0;
let sessionXp = 0;
let answered = false;
let lastRange = "all";

const $ = id => document.getElementById(id);

function readSave() {
  try { return JSON.parse(localStorage.getItem(XP_KEY)) || {}; }
  catch { return {}; }
}

function getTotalXp() {
  return Number(readSave().xp || 0);
}

function getMistakes() {
  try {
    const data = JSON.parse(localStorage.getItem(MISTAKES_KEY)) || [];
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function saveMistakes(items) {
  localStorage.setItem(MISTAKES_KEY, JSON.stringify(items));
}

function updateStats() {
  const xp = getTotalXp();
  $("totalXp").textContent = xp + " XP";
  $("level").textContent = "Lv." + (Math.floor(xp / 100) + 1);
  $("mistakeCount").textContent = getMistakes().length + "語";
}

/* CSVを、カンマを含む引用符付きセルにも対応して読み込む */
function parseCSVLine(line) {
  const fields = [];
  let field = "";
  let quoted = false;

  for (let i = 0; i < line.length; i++) {
    const ch = line[i];

    if (ch === '"') {
      if (quoted && line[i + 1] === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (ch === "," && !quoted) {
      fields.push(field.trim());
      field = "";
    } else {
      field += ch;
    }
  }

  fields.push(field.trim());
  return fields;
}

function parseCSV(text) {
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(line => line.trim());
  if (lines.length < 2) return [];

  const words = [];

  for (const line of lines.slice(1)) {
    const cols = parseCSVLine(line);
    if (cols.length < 3) continue;

    const number = Number(cols[0]);
    const en = cols[1];
    const ja = cols.slice(2).join(",").trim();

    if (Number.isFinite(number) && en && ja) {
      words.push({ number, en, ja });
    }
  }

  return words;
}

async function loadWords() {
  const status = $("loadStatus");

  try {
    const datasets = await Promise.all(
      CSV_FILES.map(async file => {
        const response = await fetch(file, { cache: "no-store" });
        if (!response.ok) throw new Error(file + " を読み込めませんでした");
        return parseCSV(await response.text());
      })
    );

    /* 単語番号が重複していた場合は1つにまとめる */
    const unique = new Map();
    datasets.flat().forEach(word => unique.set(word.number, word));
    WORDS = [...unique.values()].sort((a, b) => a.number - b.number);

    if (!WORDS.length) throw new Error("CSVに単語データがありません");

    status.textContent = `単語データ ${WORDS.length}語を読み込みました。`;
    $("startBtn").disabled = false;
  } catch (error) {
    status.textContent =
      "単語データを読み込めませんでした。CSVファイル2つがこのHTMLと同じフォルダにあるか確認してください。";
    console.error(error);
  }

  updateStats();
}

function pickRandom(items, count) {
  const copy = [...items];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy.slice(0, Math.min(count, copy.length));
}


function makeQuestions() {
  const start = Number($("startNumber").value);
  const end = Number($("endNumber").value);
  const limit = Number($("questionLimit").value);

  if (
    !Number.isInteger(start) ||
    !Number.isInteger(end) ||
    !Number.isInteger(limit) ||
    start < 1 ||
    end < start ||
    limit < 1
  ) {
    alert("開始番号・終了番号・出題数を正しく入力してください。");
    return [];
  }

  const pool = WORDS.filter(
    word => word.number >= start && word.number <= end
  );

  if (!pool.length) {
    alert("指定した範囲に単語がありません。番号を確認してください。");
    return [];
  }

  if (limit > pool.length) {
    alert(`指定範囲には ${pool.length} 語しかありません。出題数を減らしてください。`);
    return [];
  }

  return pickRandom(pool, limit).map(word => {
    const distractors = pickRandom(
      WORDS.filter(
        item => item.number !== word.number && item.ja !== word.ja
      ),
      3
    );

    const options = pickRandom([
      { ...word, isCorrect: true },
      ...distractors.map(item => ({ ...item, isCorrect: false }))
    ], 4);

    return { ...word, options };
  });
}

function startQuiz(range = $("range").value) {
  questions = makeQuestions();

  if (!questions.length) {
    alert(range === "mistakes"
      ? "復習リストに単語がありません。通常のクイズに挑戦してみてね！"
      : "この範囲の単語が見つかりません。CSVファイルを確認してください。");
    return;
  }

  currentIndex = 0;
  correct = 0;
  sessionXp = 0;
  answered = false;

  $("setup").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderQuestion() {
  answered = false;
  const q = questions[currentIndex];

  $("questionCount").textContent = `${currentIndex + 1} / ${questions.length}`;
  $("correctCount").textContent = correct;
  $("sessionXp").textContent = sessionXp + " XP";
  $("progressBar").style.width = `${currentIndex / questions.length * 100}%`;
  $("wordNumber").textContent = `単語番号 ${q.number}`;
  $("questionWord").textContent = q.en;
  $("answers").innerHTML = "";
  $("feedback").classList.add("hidden");
  $("nextBtn").classList.add("hidden");

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "answer";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = String.fromCharCode(65 + index);

    const meaning = document.createElement("span");
    meaning.textContent = option.ja;

    button.append(letter, meaning);
    button.addEventListener("click", () => chooseAnswer(option, button));
    $("answers").appendChild(button);
  });
}

function chooseAnswer(option, clickedButton) {
  if (answered) return;
  answered = true;

  const q = questions[currentIndex];
  const buttons = [...$("answers").querySelectorAll("button")];
  buttons.forEach(button => button.disabled = true);

  const isCorrect = option.number === q.number;
  const mistakes = new Map(
    getMistakes().map(item => {
      const number = Number(typeof item === "object" ? item.number : item);
      return [number, { number }];
    })
  );

  if (isCorrect) {
    correct++;
    sessionXp += 10;

    const saved = readSave();
    saved.xp = Number(saved.xp || 0) + 10;
    localStorage.setItem(XP_KEY, JSON.stringify(saved));

    mistakes.delete(q.number);
    $("feedback").textContent = "正解！ +10 XP 🎉";
    clickedButton.classList.add("correct");
  } else {
    mistakes.set(q.number, { number: q.number });
    $("feedback").textContent = `不正解… 正解は「${q.ja}」です。`;
    clickedButton.classList.add("wrong");

    const correctButton = buttons.find(
      button => button.lastElementChild.textContent === q.ja
    );
    if (correctButton) correctButton.classList.add("correct");
  }

  saveMistakes([...mistakes.values()]);
  $("feedback").classList.remove("hidden");
  $("correctCount").textContent = correct;
  $("sessionXp").textContent = sessionXp + " XP";
  $("progressBar").style.width = `${(currentIndex + 1) / questions.length * 100}%`;
  $("nextBtn").textContent =
    currentIndex === questions.length - 1 ? "結果を見る →" : "次の問題へ →";
  $("nextBtn").classList.remove("hidden");

  updateStats();
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function showResult() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");

  $("resultScore").textContent = `${correct} / ${questions.length}`;

  const percentage = Math.round(correct / questions.length * 100);
  $("resultMessage").textContent =
    percentage === 100 ? "満点！すばらしい！🏆" :
    percentage >= 80 ? "すごい！かなり身についているね！✨" :
    percentage >= 50 ? "いい調子！間違えた単語を復習しよう！💪" :
    "復習して、もう一度チャレンジしよう！📚";

  $("resultXp").textContent = sessionXp + " XP";
  $("resultTotalXp").textContent = getTotalXp() + " XP";
  $("resultLevel").textContent = "Lv." + (Math.floor(getTotalXp() / 100) + 1);

  const missedNumbers = new Set(
    getMistakes().map(item => Number(typeof item === "object" ? item.number : item))
  );
  const missed = questions.filter(q => missedNumbers.has(q.number));

  if (missed.length) {
    $("resultMistakes").innerHTML =
      `<h3>今回の復習単語 (${missed.length}語)</h3>` +
      missed.map(q =>
        `<p><strong>${q.number}. ${escapeHtml(q.en)}</strong> — ${escapeHtml(q.ja)}</p>`
      ).join("");
  } else {
    $("resultMistakes").innerHTML = "<p>全問正解！復習リストは空です 🎉</p>";
  }

  updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("startBtn").addEventListener("click", () => startQuiz());
$("nextBtn").addEventListener("click", nextQuestion);
$("retryBtn").addEventListener("click", () => startQuiz());

$("homeBtn").addEventListener("click", () => {
  $("result").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("setup").classList.remove("hidden");
  updateStats();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

$("range").addEventListener("change", () => {
  $("startBtn").textContent =
    $("range").value === "mistakes" ? "復習クイズを始める" : "クイズを始める";
});

loadWords();
</script>
</body>
</html>
