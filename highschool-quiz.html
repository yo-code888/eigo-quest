
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6558e8">
<title>4択英単語クイズ｜高校生版・英単語クエスト</title>
<style>
  
/* 上部固定ナビゲーション */
.common-top-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid #ddd;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.common-top-nav a,
.common-top-nav button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 8px 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  color: #222;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

/* 固定ナビに本文が隠れないようにする */
body {
  padding-top: 68px;
}

:root {
  --purple:#6558e8; --pink:#ff719b; --mint:#5bd6b0;
  --bg:#f5f5ff; --ink:#202344; --muted:#777b99;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 10% 5%,#e8e5ff,transparent 30%),
    radial-gradient(circle at 90% 20%,#ffe5ef,transparent 28%),var(--bg);
}
button { font:inherit; }
.wrap { max-width:820px; margin:auto; padding:18px; }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:22px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:900; }
.logo { display:grid; place-items:center; width:44px; height:44px; border-radius:14px; color:white; font-size:1.4rem; background:linear-gradient(135deg,var(--purple),#a18aff); }
.stats { display:flex; gap:8px; flex-wrap:wrap; }
.pill { background:white; border-radius:999px; padding:9px 12px; box-shadow:0 4px 14px #30305c0c; font-weight:800; }
.pill b { color:var(--purple); }
.hero { padding:24px; border-radius:25px; color:white; background:linear-gradient(125deg,#6558e8,#8873f6 60%,#b58aff); box-shadow:0 14px 30px #6558e82b; }
.eyebrow { font-size:.78rem; font-weight:900; letter-spacing:.1em; }
h1 { font-size:clamp(1.7rem,5vw,2.5rem); margin:10px 0; }
.hero p { line-height:1.7; margin:0; }
.panel { background:white; padding:22px; margin-top:18px; border-radius:23px; box-shadow:0 8px 22px #34345c0b; }
.progress-row { display:flex; justify-content:space-between; gap:10px; font-size:.9rem; font-weight:800; color:var(--muted); }
.progress { height:10px; background:#eeedfa; border-radius:999px; overflow:hidden; margin:10px 0 22px; }
.bar { height:100%; width:0; background:linear-gradient(90deg,var(--purple),var(--pink)); transition:width .25s; }
.question-label { color:var(--muted); font-weight:800; font-size:.9rem; }
.question { font-size:clamp(1.8rem,6vw,2.6rem); font-weight:900; margin:12px 0 7px; overflow-wrap:anywhere; }
.hint { color:var(--muted); margin-bottom:20px; }
.options { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.option { text-align:left; border:2px solid #e9e7f8; border-radius:16px; background:#fcfbff; padding:16px; cursor:pointer; font-weight:800; min-height:65px; color:var(--ink); }
.option:hover:not(:disabled) { border-color:var(--purple); background:#f3f0ff; }
.option:disabled { cursor:default; }
.option.correct { border-color:#37bd91; background:#e9fff6; }
.option.wrong { border-color:#ff719b; background:#fff0f5; }
.feedback { min-height:52px; margin-top:16px; padding:13px 15px; border-radius:14px; background:#f5f4ff; line-height:1.6; }
.feedback.good { background:#e9fff6; }
.feedback.bad { background:#fff0f5; }
.actions { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btn { border:0; border-radius:13px; padding:13px 18px; font-weight:900; cursor:pointer; }
.btn-primary { background:var(--purple); color:white; }
.btn-light { background:#f0efff; color:var(--purple); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.talk { display:flex; align-items:center; gap:12px; background:white; padding:15px; margin-top:18px; border-radius:18px; box-shadow:0 8px 22px #34345c0b; }
.talk .icon { font-size:2rem; }
.talk p { margin:4px 0 0; color:var(--muted); line-height:1.6; }
.result { text-align:center; }
.result-emoji { font-size:3.5rem; }
.result h2 { font-size:1.8rem; margin:8px 0; }
.score { font-size:2.5rem; color:var(--purple); font-weight:1000; }
.mistake-list { text-align:left; padding-left:22px; line-height:1.9; }
.links { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.link { display:inline-block; padding:12px 15px; border-radius:13px; background:white; font-weight:800; box-shadow:0 4px 14px #30305c0c; text-decoration:none; color:inherit; }
footer { text-align:center; padding:25px 5px; color:#898ba5; font-size:.8rem; }
@media(max-width:520px) {
  .wrap { padding:12px; } header { align-items:flex-start; }
  .pill { padding:7px 9px; font-size:.8rem; }
  .panel { padding:16px; }
  .options { grid-template-columns:1fr; gap:9px; }
  .option { min-height:55px; padding:13px; }
}
</style>
</head>
<body>
  
<nav class="common-top-nav">
  <a href="index.html" class="nav-home">🏠 ホーム</a>
  <button type="button" class="nav-back" onclick="history.back()">
    ↩️ 戻る
  </button>
</nav>

<div class="wrap">
<header>
  <div class="brand">
    <div class="logo">⚔️</div>
    <div>英単語クエスト<small style="display:block;color:#777b99">高校生版 · 4択クイズ</small></div>
  </div>
  <div class="stats">
    <div class="pill">⭐ Lv.<b id="level">1</b></div>
    <div class="pill">💎 <b id="xp">0</b> XP</div>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">HIGH SCHOOL · WORD QUEST</div>
  <h1>🎯 英単語4択チャレンジ</h1>
  <p>英単語の意味を4つの選択肢から選ぼう！全10問。正解を重ねて経験値を獲得しよう。</p>
</section>

<section class="panel" id="quizPanel">
  <div class="progress-row">
    <span id="questionCount">準備中...</span>
    <span id="scoreLabel">正解 0</span>
  </div>
  <div class="progress"><div class="bar" id="progressBar"></div></div>

  <div id="questionArea">
    <div class="question-label">次の英単語の意味は？</div>
    <div class="question" id="word">Ready?</div>
    <div class="hint">最も適切な日本語を選択してください。</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite">準備ができたらスタート！</div>
    <div class="actions">
      <button class="btn btn-light" id="startBtn">クイズを開始</button>
      <button class="btn btn-primary" id="nextBtn" disabled>次の問題 →</button>
    </div>
  </div>
</section>

<section class="talk">
  <div class="icon">🧙‍♂️</div>
  <div>
    <strong>冒険ガイドのアドバイス</strong>
    <p id="guideMessage">わからない単語があっても大丈夫。間違えた単語は復習ページで確認できるよ！</p>
  </div>
</section>

<div class="links">
  <a class="link" href="highschool.html">← 高校生版メニュー</a>
  <a class="link" href="index.html">🏠 ホームに戻る</a>
</div>
<footer>英単語クエスト · 高校生版</footer>
</div>

<script>
const WORDS = [
  {en:"achieve",ja:"達成する"},
  {en:"increase",ja:"増加する"},
  {en:"reduce",ja:"減らす"},
  {en:"provide",ja:"提供する"},
  {en:"require",ja:"必要とする"},
  {en:"consider",ja:"よく考える"},
  {en:"environment",ja:"環境"},
  {en:"opportunity",ja:"機会"},
  {en:"experience",ja:"経験"},
  {en:"knowledge",ja:"知識"},
  {en:"improve",ja:"改善する"},
  {en:"develop",ja:"発達する・開発する"},
  {en:"suggest",ja:"提案する"},
  {en:"avoid",ja:"避ける"},
  {en:"allow",ja:"許す"},
  {en:"purpose",ja:"目的"},
  {en:"probably",ja:"おそらく"},
  {en:"although",ja:"〜だけれども"},
  {en:"necessary",ja:"必要な"},
  {en:"opinion",ja:"意見"},
  {en:"decide",ja:"決める"},
  {en:"discover",ja:"発見する"},
  {en:"support",ja:"支援する"},
  {en:"instead",ja:"その代わりに"},
  {en:"successful",ja:"成功した"},
  {en:"especially",ja:"特に"},
  {en:"responsible",ja:"責任がある"},
  {en:"suggestion",ja:"提案"},
  {en:"available",ja:"利用できる"},
  {en:"relationship",ja:"関係"}
];

const SAVE_KEY = "eigoQuestSave";
const MISTAKE_KEY = "eigoQuestMistakes";
const $ = id => document.getElementById(id);

let questions = [];
let current = 0;
let correctCount = 0;
let earnedXP = 0;
let answered = false;
let started = false;
let mistakesThisRun = [];

function readJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}

function updateStats() {
  const save = readJSON(SAVE_KEY, {});
  const xp = Number(save.xp) || 0;
  $("xp").textContent = xp;
  $("level").textContent = Math.floor(xp / 100) + 1;
}

function shuffle(list) {
  const arr = [...list];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function saveXP(amount) {
  if (amount <= 0) return;
  const save = readJSON(SAVE_KEY, {});
  save.xp = (Number(save.xp) || 0) + amount;
  localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  earnedXP += amount;
  updateStats();
}

function saveMistake(word) {
  const list = readJSON(MISTAKE_KEY, []);
  const safeList = Array.isArray(list) ? list : [];
  const existing = safeList.find(item => item.en === word.en);

  if (existing) {
    existing.count = (Number(existing.count) || 0) + 1;
    existing.lastSeen = new Date().toISOString();
    existing.ja = word.ja;
  } else {
    safeList.push({
      en: word.en,
      ja: word.ja,
      count: 1,
      lastSeen: new Date().toISOString()
    });
  }

  localStorage.setItem(MISTAKE_KEY, JSON.stringify(safeList));
}

function makeQuestions() {
  questions = shuffle(WORDS).slice(0, 10).map(word => {
    const wrong = shuffle(WORDS.filter(item => item.en !== word.en)).slice(0, 3);
    const options = shuffle([word, ...wrong]);
    return { word, options };
  });
}

function startQuiz() {
  current = 0;
  correctCount = 0;
  earnedXP = 0;
  answered = false;
  started = true;
  mistakesThisRun = [];
  makeQuestions();
  $("startBtn").style.display = "none";
  $("nextBtn").disabled = true;
  $("guideMessage").textContent = "集中して挑戦しよう！1問正解するごとに10 XP獲得できるよ。";
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = questions[current];
  $("questionCount").textContent = `第 ${current + 1} 問 / ${questions.length} 問`;
  $("scoreLabel").textContent = `正解 ${correctCount}`;
  $("progressBar").style.width = `${current / questions.length * 100}%`;
  $("word").textContent = item.word.en;
  $("feedback").className = "feedback";
  $("feedback").textContent = "正しい意味を選んでね！";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = current === questions.length - 1 ? "結果を見る →" : "次の問題 →";
  $("options").replaceChildren();

  item.options.forEach(option => {
    const button = document.createElement("button");
    button.className = "option";
    button.type = "button";
    button.textContent = option.ja;
    button.addEventListener("click", () => chooseAnswer(button, option));
    $("options").appendChild(button);
  });
}

function chooseAnswer(button, selected) {
  if (answered) return;
  answered = true;

  const item = questions[current];
  const correct = selected.en === item.word.en;

  document.querySelectorAll(".option").forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === item.word.ja) btn.classList.add("correct");
  });

  if (correct) {
    correctCount++;
    saveXP(10);
    $("feedback").className = "feedback good";
    $("feedback").textContent = `正解！🎉「${item.word.en}」は「${item.word.ja}」という意味だよ。+10 XP`;
    $("guideMessage").textContent = "いい調子！この調子で次の問題も挑戦しよう。";
  } else {
    button.classList.add("wrong");
    saveMistake(item.word);
    mistakesThisRun.push(item.word);
    $("feedback").className = "feedback bad";
    $("feedback").textContent = `残念！正解は「${item.word.ja}」。この単語は復習リストに保存したよ。`;
    $("guideMessage").textContent = "間違えた単語は復習ページで何度でも練習できるよ。";
  }

  $("scoreLabel").textContent = `正解 ${correctCount}`;
  $("nextBtn").disabled = false;
}

function showResult() {
  $("progressBar").style.width = "100%";
  $("questionCount").textContent = "クエスト完了！";
  $("scoreLabel").textContent = `正解 ${correctCount} / 10`;

  const area = $("questionArea");
  area.replaceChildren();

  const result = document.createElement("div");
  result.className = "result";

  const emoji = document.createElement("div");
  emoji.className = "result-emoji";
  emoji.textContent = correctCount === 10 ? "🏆" : correctCount >= 7 ? "🎉" : "💪";

  const title = document.createElement("h2");
  title.textContent = correctCount === 10 ? "パーフェクト！" :
    correctCount >= 7 ? "よくできました！" : "チャレンジ完了！";

  const score = document.createElement("div");
  score.className = "score";
  score.textContent = `${correctCount} / 10`;

  const message = document.createElement("p");
  message.textContent = `獲得経験値：+${earnedXP} XP`;

  const detail = document.createElement("p");
  detail.textContent = mistakesThisRun.length
    ? `間違えた単語：${mistakesThisRun.length}語。復習ページで確認しよう！`
    : "間違いなし！すばらしい！";

  result.append(emoji, title, score, message, detail);

  if (mistakesThisRun.length) {
    const list = document.createElement("ul");
    list.className = "mistake-list";
    mistakesThisRun.forEach(word => {
      const li = document.createElement("li");
      li.textContent = `${word.en}：${word.ja}`;
      list.appendChild(li);
    });
    result.appendChild(list);
  }

  const actions = document.createElement("div");
  actions.className = "actions";

  const retry = document.createElement("button");
  retry.className = "btn btn-light";
  retry.textContent = "もう一度挑戦";
  retry.addEventListener("click", () => {
    area.innerHTML = `
      <div class="question-label">次の英単語の意味は？</div>
      <div class="question" id="word">Ready?</div>
      <div class="hint">最も適切な日本語を選択してください。</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite">準備ができたらスタート！</div>
      <div class="actions">
        <button class="btn btn-light" id="startBtn">クイズを開始</button>
        <button class="btn btn-primary" id="nextBtn" disabled>次の問題 →</button>
      </div>`;
    $("startBtn").addEventListener("click", startQuiz);
    $("nextBtn").addEventListener("click", nextQuestion);
    $("startBtn").click();
  });

  const menu = document.createElement("a");
  menu.className = "link";
  menu.href = "highschool.html";
  menu.textContent = "高校生版メニュー";

  actions.append(retry, menu);
  result.appendChild(actions);
  area.appendChild(result);
  $("startBtn").style.display = "none";
  $("nextBtn").style.display = "none";
  $("guideMessage").textContent = "クエスト完了！復習ページも使って、苦手な単語を覚えていこう。";
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", nextQuestion);

updateStats();
</script>
</body>
</html>
