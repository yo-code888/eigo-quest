
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6558e8">
<title>単語帳｜中学生版・英単語クエスト</title>
<style>
  
/* 上部固定ナビゲーション */
.common-top-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid #ddd;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.common-top-nav a,
.common-top-nav button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 8px 16px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: #fff;
  color: #222;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}

/* 固定ナビに本文が隠れないようにする */
body {
  padding-top: 68px;
}

:root {
  --purple:#6558e8;
  --pink:#ff719b;
  --mint:#5bd6b0;
  --bg:#f5f5ff;
  --ink:#202344;
  --muted:#777b99;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 5%,#e8e5ff,transparent 30%),
    radial-gradient(circle at 90% 20%,#ffe5ef,transparent 28%),
    var(--bg);
}
button,input,select { font:inherit; }
a { color:inherit; text-decoration:none; }
.wrap { max-width:900px; margin:auto; padding:18px; }
header {
  display:flex; justify-content:space-between;
  align-items:center; gap:12px; margin-bottom:22px;
}
.brand { display:flex; align-items:center; gap:10px; font-weight:900; }
.logo {
  display:grid; place-items:center; width:44px; height:44px;
  border-radius:14px; color:white; font-size:1.4rem;
  background:linear-gradient(135deg,var(--purple),#a18aff);
}
.stats { display:flex; gap:8px; flex-wrap:wrap; }
.pill {
  background:white; border-radius:999px; padding:9px 12px;
  box-shadow:0 4px 14px #30305c0c; font-weight:800;
}
.pill b { color:var(--purple); }
.hero {
  padding:24px; border-radius:25px; color:white;
  background:linear-gradient(125deg,#6558e8,#8873f6 60%,#b58aff);
  box-shadow:0 14px 30px #6558e82b;
}
.eyebrow { font-size:.78rem; font-weight:900; letter-spacing:.1em; }
h1 { font-size:clamp(1.8rem,5vw,2.7rem); margin:10px 0; }
.hero p { line-height:1.7; margin:0; }
.panel {
  background:white; padding:20px; margin-top:18px;
  border-radius:23px; box-shadow:0 8px 22px #34345c0b;
}
.search-row {
  display:grid; grid-template-columns:1fr auto; gap:10px;
}
.input {
  width:100%; min-width:0; padding:13px 14px;
  border:2px solid #e7e6f6; border-radius:13px;
  outline:none; background:white; color:var(--ink);
}
.input:focus { border-color:var(--purple); }
.primary {
  border:0; padding:13px 17px; border-radius:13px;
  background:var(--purple); color:white; font-weight:900; cursor:pointer;
}
.toolbar {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap; margin-top:15px;
}
.filters { display:flex; gap:8px; flex-wrap:wrap; }
.filter {
  border:1px solid #e7e6f6; background:white; color:var(--ink);
  padding:9px 12px; border-radius:999px; cursor:pointer; font-weight:800;
}
.filter.active { background:#6558e8; color:white; border-color:#6558e8; }
.count { color:var(--muted); font-size:.9rem; }
.word-list { display:grid; gap:11px; margin-top:16px; }
.word {
  display:grid; grid-template-columns:1fr auto;
  align-items:center; gap:12px; padding:15px;
  border:1px solid #eeecfa; border-radius:16px; background:#fcfbff;
}
.word-main { min-width:0; }
.word-top { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.word-top strong { font-size:1.15rem; overflow-wrap:anywhere; }
.part {
  background:#f0efff; color:#5a4ed5;
  border-radius:7px; padding:3px 7px; font-size:.75rem; font-weight:800;
}
.meaning { margin-top:5px; line-height:1.6; }
.example { color:var(--muted); font-size:.88rem; line-height:1.6; margin-top:4px; }
.actions { display:flex; gap:7px; align-items:center; }
.icon-btn {
  width:42px; height:42px; border-radius:12px;
  border:1px solid #e7e6f6; background:white;
  cursor:pointer; font-size:1.1rem;
}
.icon-btn.saved { background:#fff0f3; border-color:#ffd4e0; }
.empty { text-align:center; color:var(--muted); padding:30px 10px; line-height:1.8; }
.talk {
  display:flex; align-items:center; gap:12px;
  background:white; padding:15px; margin-top:18px;
  border-radius:18px; box-shadow:0 8px 22px #34345c0b;
}
.talk .icon { font-size:2rem; }
.talk p { margin:4px 0 0; color:var(--muted); line-height:1.6; }
.links { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.link {
  display:inline-block; padding:12px 15px; border-radius:13px;
  background:white; font-weight:800; box-shadow:0 4px 14px #30305c0c;
}
footer { text-align:center; padding:25px 5px; color:#898ba5; font-size:.8rem; }
@media(max-width:550px) {
  .wrap { padding:12px; }
  header { align-items:flex-start; }
  .pill { padding:7px 9px; font-size:.8rem; }
  .panel { padding:15px; }
  .search-row { grid-template-columns:1fr; }
  .word { padding:12px; }
  .icon-btn { width:38px; height:38px; }
}
</style>
</head>
<body>
  
<nav class="common-top-nav">
  <a href="index.html" class="nav-home">🏠 ホーム</a>
  <button type="button" class="nav-back" onclick="history.back()">
    ↩️ 戻る
  </button>
</nav>

<div class="wrap">

<header>
  <div class="brand">
    <div class="logo">⚔️</div>
    <div>英単語クエスト
      <small style="display:block;color:#777b99">中学生版 · 単語帳</small>
    </div>
  </div>
  <div class="stats">
    <div class="pill">⭐ Lv.<b id="level">1</b></div>
    <div class="pill">💎 <b id="xp">0</b> XP</div>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">JUNIOR WORD BOOK</div>
  <h1>📖 自分だけの単語帳</h1>
  <p>英単語を検索して意味を確認しよう。⭐を押すとお気に入りに登録できるよ！</p>
</section>

<section class="panel">
  <div class="search-row">
    <input class="input" id="search" type="search"
      placeholder="英単語・日本語の意味で検索..." aria-label="単語を検索">
    <button class="primary" id="clearSearch">検索をクリア</button>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="favorite">⭐ お気に入り</button>
    </div>
    <span class="count" id="count">0語</span>
  </div>

  <div class="word-list" id="wordList"></div>
</section>

<section class="talk">
  <div class="icon">🧙‍♂️</div>
  <div>
    <strong>冒険ガイドのアドバイス</strong>
    <p id="guideMessage">気になる単語を検索してみよう！お気に入りに登録すれば、あとから見返しやすいよ。✨</p>
  </div>
</section>

<div class="links">
  <a class="link" href="junior.html">← 中学生版メニュー</a>
  <a class="link" href="index.html">🏠 ホームに戻る</a>
</div>

<footer>英単語クエスト · 中学生版</footer>
</div>

<script>
const WORDS = [
  {en:"apple",ja:"りんご",pos:"名詞",example:"I eat an apple."},
  {en:"book",ja:"本",pos:"名詞",example:"This is my book."},
  {en:"school",ja:"学校",pos:"名詞",example:"I go to school."},
  {en:"friend",ja:"友達",pos:"名詞",example:"She is my friend."},
  {en:"family",ja:"家族",pos:"名詞",example:"I love my family."},
  {en:"water",ja:"水",pos:"名詞",example:"I drink water."},
  {en:"beautiful",ja:"美しい",pos:"形容詞",example:"It is a beautiful flower."},
  {en:"important",ja:"重要な",pos:"形容詞",example:"English is important."},
  {en:"study",ja:"勉強する",pos:"動詞",example:"I study English."},
  {en:"practice",ja:"練習する",pos:"動詞",example:"I practice every day."},
  {en:"always",ja:"いつも",pos:"副詞",example:"I always get up early."},
  {en:"sometimes",ja:"ときどき",pos:"副詞",example:"I sometimes play tennis."},
  {en:"because",ja:"なぜなら",pos:"接続詞",example:"I stayed home because it rained."},
  {en:"different",ja:"異なる",pos:"形容詞",example:"We have different ideas."},
  {en:"interesting",ja:"おもしろい",pos:"形容詞",example:"This book is interesting."},
  {en:"arrive",ja:"到着する",pos:"動詞",example:"I arrive at school at eight."},
  {en:"borrow",ja:"借りる",pos:"動詞",example:"Can I borrow your pen?"},
  {en:"decide",ja:"決める",pos:"動詞",example:"I decide to try again."},
  {en:"enjoy",ja:"楽しむ",pos:"動詞",example:"I enjoy playing soccer."},
  {en:"future",ja:"未来",pos:"名詞",example:"Think about your future."}
];

const FAVORITE_KEY = "eigoQuestJuniorFavorites";
const SAVE_KEY = "eigoQuestSave";

const $ = id => document.getElementById(id);
let filterMode = "all";

function readJSON(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function getFavorites() {
  const data = readJSON(FAVORITE_KEY, []);
  return Array.isArray(data) ? data : [];
}

function updateStats() {
  const save = readJSON(SAVE_KEY, {});
  const xp = Number(save.xp) || 0;
  $("xp").textContent = xp;
  $("level").textContent = Math.floor(xp / 100) + 1;
}

function renderWords() {
  const query = $("search").value.trim().toLowerCase();
  const favorites = getFavorites();

  const results = WORDS.filter(word => {
    const matchesQuery =
      word.en.toLowerCase().includes(query) ||
      word.ja.toLowerCase().includes(query) ||
      word.pos.toLowerCase().includes(query) ||
      word.example.toLowerCase().includes(query);

    const matchesFilter =
      filterMode === "all" ||
      (filterMode === "favorite" && favorites.includes(word.en));

    return matchesQuery && matchesFilter;
  });

  $("count").textContent = `${results.length}語`;
  $("wordList").replaceChildren();

  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = filterMode === "favorite" && favorites.length === 0
      ? "お気に入りはまだないよ。単語の⭐を押して登録しよう！"
      : "見つからなかったよ。別の単語や意味で検索してみてね。";
    $("wordList").appendChild(empty);
    return;
  }

  results.forEach(word => {
    const item = document.createElement("article");
    item.className = "word";

    const main = document.createElement("div");
    main.className = "word-main";

    const top = document.createElement("div");
    top.className = "word-top";

    const en = document.createElement("strong");
    en.textContent = word.en;

    const pos = document.createElement("span");
    pos.className = "part";
    pos.textContent = word.pos;

    top.append(en, pos);

    const meaning = document.createElement("div");
    meaning.className = "meaning";
    meaning.textContent = word.ja;

    const example = document.createElement("div");
    example.className = "example";
    example.textContent = `例文：${word.example}`;

    main.append(top, meaning, example);

    const actions = document.createElement("div");
    actions.className = "actions";

    const fav = document.createElement("button");
    fav.type = "button";
    fav.className = "icon-btn" + (favorites.includes(word.en) ? " saved" : "");
    fav.textContent = favorites.includes(word.en) ? "⭐" : "☆";
    fav.setAttribute("aria-label", `${word.en}をお気に入り登録`);
    fav.title = "お気に入り";

    fav.addEventListener("click", () => {
      const updated = getFavorites();
      const idx = updated.indexOf(word.en);

      if (idx >= 0) {
        updated.splice(idx, 1);
        $("guideMessage").textContent = `${word.en}をお気に入りから外したよ。`;
      } else {
        updated.push(word.en);
        $("guideMessage").textContent = `${word.en}をお気に入りに登録したよ！⭐`;
      }

      localStorage.setItem(FAVORITE_KEY, JSON.stringify(updated));
      renderWords();
    });

    actions.appendChild(fav);
    item.append(main, actions);
    $("wordList").appendChild(item);
  });
}

$("search").addEventListener("input", renderWords);

$("clearSearch").addEventListener("click", () => {
  $("search").value = "";
  filterMode = "all";
  document.querySelectorAll(".filter").forEach(button => {
    button.classList.toggle("active", button.dataset.filter === "all");
  });
  renderWords();
  $("search").focus();
});

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    filterMode = button.dataset.filter;
    document.querySelectorAll(".filter").forEach(item => {
      item.classList.toggle("active", item === button);
    });
    renderWords();
  });
});

updateStats();
renderWords();
window.addEventListener("storage", () => {
  updateStats();
  renderWords();
});
</script>
</body>
</html>
